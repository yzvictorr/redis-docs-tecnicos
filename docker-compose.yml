services:
  redis:
    image: redis:7-alpine
    # AOF ligado: cada escrita vai para o disco, então os dados sobrevivem a um restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  # Interface gráfica para mostrar as chaves no vídeo (http://localhost:5540).
  # Ao abrir, adicione o banco com host "redis" e porta 6379.
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  redis_data:
